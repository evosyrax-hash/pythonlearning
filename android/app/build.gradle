plugins {
    id 'com.android.application'
}

android {
    namespace 'app.pythonpractice'
    compileSdk 36

    defaultConfig {
        applicationId 'app.pythonpractice'
        minSdk 29
        // 34 on purpose: keeps the classic keyboard-resize and back-button behaviour.
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
